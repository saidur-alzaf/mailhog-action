<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-Time Passcode</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eef2ff;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrapper {
        width: 100%;
        padding: 24px 16px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .header {
        background: #4338ca;
        padding: 32px;
        color: #ffffff;
        text-align: center;
      }
      .header h1 {
        margin: 0;
        font-size: 28px;
      }
      .body {
        padding: 32px;
      }
      .code-box {
        display: inline-block;
        padding: 18px 24px;
        margin: 20px 0;
        font-size: 26px;
        letter-spacing: 0.16em;
        border-radius: 16px;
        background: #f3f4ff;
        border: 1px solid #dbeafe;
        color: #1e40af;
      }
      .body p {
        margin: 0 0 18px;
        line-height: 1.75;
        color: #4b5563;
        font-size: 16px;
      }
      .footer {
        padding: 24px 32px 32px;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 14px;
      }
      .footer p {
        margin: 0;
      }
      @media (max-width: 520px) {
        .body,
        .footer,
        .header {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <h1>Verify your login</h1>
        </div>
        <div class="body">
          <p>
            Use the one-time passcode below to complete sign-in to your account.
            This code expires in 10 minutes.
          </p>
          <div class="code-box">123456</div>
          <p>
            If you did not request this code, please ignore this message or
            contact support immediately.
          </p>
        </div>
        <div class="footer">
          <p>Example Company • Authentication team</p>
        </div>
      </div>
    </div>
  </body>
</html>
